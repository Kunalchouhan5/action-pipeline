name: My First Workflow

on:
  push:

# on: 
#   workflow_dispatch: 

env:
  PROJECT_NAME: GitHubActionsLab
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hello-job:

    runs-on: ubuntu-latest

    steps:

      - name: Print Welcome Message
        run: echo "Hello Kunal, Welcome to GitHub Actions"

      - name: Print Variable
        run: echo $PROJECT_NAME

      - name: Display Repository
        run: echo ${{ github.repository }}

      - name: Display Actor
        run: echo ${{ github.actor }}

      - name: Display Branch
        run: echo ${{ github.ref }}

      - name: Checkout Code
        uses: actions/checkout@v4
        # run: echo "Testing with Node 24"

      - name: Show Files
        run: ls -la  
        
